name: Build Geode Mod (All Platforms)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GEODE_SDK_VERSION: v5.11.2

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI & SDK
        shell: pwsh
        run: |
          $cliDir = "$env:RUNNER_TEMP\geode-cli"
          New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "win.*\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "Windows Geode CLI asset not found." }
          $zipPath = "$cliDir\geode-cli.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $cliDir -Force
          $exePath = Get-ChildItem -Path $cliDir -Filter "geode.exe" -Recurse | Select-Object -First 1
          "$($exePath.Directory.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exePath.FullName sdk install --version $env:GEODE_SDK_VERSION

      - name: Build Windows (.geode)
        shell: pwsh
        run: geode build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTo100-windows
          path: build/*.geode

  build-android-32:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Geode CLI & SDK
        shell: bash
        run: |
          CLI_DIR="$RUNNER_TEMP/geode-cli"
          mkdir -p "$CLI_DIR"
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/geode-sdk/cli/releases/latest)
          ASSET_URL=$(echo "$RELEASE_JSON" | grep -oE 'https://[^"]*(linux|ubuntu)[^"]*\.(tar\.gz|zip)' | head -n 1)
          curl -fsSL "$ASSET_URL" -o "$CLI_DIR/cli_archive"
          if [[ "$ASSET_URL" == *.zip ]]; then
            unzip -q "$CLI_DIR/cli_archive" -d "$CLI_DIR"
          else
            tar -xzf "$CLI_DIR/cli_archive" -C "$CLI_DIR"
          fi
          GEODE_BIN=$(find "$CLI_DIR" -name "geode" -type f | head -n 1)
          chmod +x "$GEODE_BIN"
          echo "$(dirname "$GEODE_BIN")" >> "$GITHUB_PATH"
          "$GEODE_BIN" sdk install --version "$GEODE_SDK_VERSION"

      - name: Build Android 32-bit (armeabi-v7a)
        shell: bash
        env:
          ANDROID_ABI: armeabi-v7a
        run: |
          geode build --platform android

      - name: Upload Android 32-bit artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTo100-android-32bit
          path: build/*.geode

  build-android-64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Geode CLI & SDK
        shell: bash
        run: |
          CLI_DIR="$RUNNER_TEMP/geode-cli"
          mkdir -p "$CLI_DIR"
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/geode-sdk/cli/releases/latest)
          ASSET_URL=$(echo "$RELEASE_JSON" | grep -oE 'https://[^"]*(linux|ubuntu)[^"]*\.(tar\.gz|zip)' | head -n 1)
          curl -fsSL "$ASSET_URL" -o "$CLI_DIR/cli_archive"
          if [[ "$ASSET_URL" == *.zip ]]; then
            unzip -q "$CLI_DIR/cli_archive" -d "$CLI_DIR"
          else
            tar -xzf "$CLI_DIR/cli_archive" -C "$CLI_DIR"
          fi
          GEODE_BIN=$(find "$CLI_DIR" -name "geode" -type f | head -n 1)
          chmod +x "$GEODE_BIN"
          echo "$(dirname "$GEODE_BIN")" >> "$GITHUB_PATH"
          "$GEODE_BIN" sdk install --version "$GEODE_SDK_VERSION"

      - name: Build Android 64-bit (arm64-v8a)
        shell: bash
        env:
          ANDROID_ABI: arm64-v8a
        run: |
          geode build --platform android

      - name: Upload Android 64-bit artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTo100-android-64bit
          path: build/*.geode

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI & SDK
        shell: bash
        run: |
          CLI_DIR="$RUNNER_TEMP/geode-cli"
          mkdir -p "$CLI_DIR"
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/geode-sdk/cli/releases/latest)
          ASSET_URL=$(echo "$RELEASE_JSON" | grep -oE 'https://[^"]*(mac|macos|darwin)[^"]*\.(tar\.gz|zip)' | head -n 1)
          curl -fsSL "$ASSET_URL" -o "$CLI_DIR/cli_archive"
          if [[ "$ASSET_URL" == *.zip ]]; then
            unzip -q "$CLI_DIR/cli_archive" -d "$CLI_DIR"
          else
            tar -xzf "$CLI_DIR/cli_archive" -C "$CLI_DIR"
          fi
          GEODE_BIN=$(find "$CLI_DIR" -name "geode" -type f | head -n 1)
          chmod +x "$GEODE_BIN"
          echo "$(dirname "$GEODE_BIN")" >> "$GITHUB_PATH"
          "$GEODE_BIN" sdk install --version "$GEODE_SDK_VERSION"

      - name: Build iOS (.geode)
        shell: bash
        run: |
          geode build --platform ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTo100-ios
          path: build/*.geode
