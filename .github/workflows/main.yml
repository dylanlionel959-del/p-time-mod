name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GEODE_SDK_VERSION: v5.11.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI
        shell: pwsh
        run: |
          $cliDir = "$env:RUNNER_TEMP\geode-cli"
          New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "win.*\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find Windows Geode CLI release asset."
          }
          $zipPath = "$cliDir\geode-cli.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $cliDir -Force
          $exePath = Get-ChildItem -Path $cliDir -Filter "geode.exe" -Recurse | Select-Object -First 1
          if (-not $exePath) {
            throw "geode.exe not found after extraction."
          }
          $binDir = $exePath.Directory.FullName
          "$binDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exePath.FullName sdk install --version $env:GEODE_SDK_VERSION

      - name: Build mod
        shell: pwsh
        run: |
          geode build

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTo100-windows
          path: build/*.geode
